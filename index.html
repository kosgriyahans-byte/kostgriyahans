<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Kost Griya Hans - Dashboard Keuangan</title>

<link rel="icon" type="image/png" sizes="48x48" href="favicon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<meta name="apple-mobile-web-app-title" content="Griya Hans"><meta name="apple-mobile-web-app-status-bar-style" content="default">

<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pptxgenjs/3.12.0/pptxgen.bundle.js"></script>
<style>
:root{--bg:#fff;--card:#fff;--ink:#111;--mut:#7a7f8c;--bd:#ececf0;--ac:#111;--am:#b9bec9;--ok:#1a8f5f;--okb:#e6f6ee;--no:#d1344b;--nob:#fdeaee;--na:#f6f7f9;--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.sb{background:#fff;border-right:1px solid var(--bd);padding:calc(22px + env(safe-area-inset-top)) 14px 20px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;animation:fade .7s var(--ease) both}
.lg{width:140px;margin:0 auto 26px;display:block}.sl,.ss{font-size:12px;color:var(--mut);margin:6px 10px}.ss{margin-top:auto}
#nv{display:flex;flex-direction:column;gap:2px}
#nv button{border:0;background:none;color:var(--mut);text-align:left;padding:10px 12px;border-radius:10px;font:600 14px inherit;cursor:pointer;transition:background .25s var(--ease),color .25s,transform .2s var(--ease)}
#nv button:hover{background:var(--na);color:var(--ink)}#nv button.on{background:var(--na);color:var(--ink);box-shadow:inset 3px 0 0 var(--ink)}
.mc{min-width:0}.tb{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:calc(16px + env(safe-area-inset-top)) 24px 16px;background:rgba(255,255,255,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--bd);flex-wrap:wrap;position:sticky;top:0;z-index:5}
.tb h1{margin:0;font-size:22px;letter-spacing:-.01em}.ta{display:flex;gap:8px}.ta select{width:auto;cursor:pointer}
.dlb{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}.dlb option{color:#000;background:#fff}
main{padding:22px 24px calc(40px + env(safe-area-inset-bottom));max-width:1200px}
.g4{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin-bottom:14px}
.g{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g2,.g3{display:grid;gap:14px;margin-bottom:14px}.g2{grid-template-columns:2fr 1fr}.g3{grid-template-columns:1fr 2fr}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:14px;transition:transform .35s var(--ease),box-shadow .35s var(--ease),border-color .3s}
.g4 .card,.g2 .card,.g3 .card,.g .card{margin:0}
.g4 .card:hover,.g2 .card:hover,.g3 .card:hover,.g .card:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(17,17,17,.07);border-color:#dcdde4}
.card h2{margin:0 0 10px;font-size:16px}small{color:var(--mut);font-size:12px;display:block}
.kv{display:flex;align-items:center;gap:8px;margin:4px 0 10px;flex-wrap:wrap}.kv b,.k b{font-size:22px;letter-spacing:-.01em}.k span{font-size:12px;color:var(--mut)}
.big{font-size:28px;display:block;margin:2px 0 10px;letter-spacing:-.02em}
.pl{font-style:normal;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px}.pl.up{background:var(--okb);color:var(--ok)}.pl.dn{background:var(--nob);color:var(--no)}
.kf{border-top:1px solid var(--bd);padding-top:8px;font-size:12px;color:var(--mut)}
.ch{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.lgd{display:flex;gap:12px;font-size:12px;color:var(--mut)}.lgd i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.rows>div{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--bd)}.rows span{color:var(--mut)}
.bar{height:6px;border-radius:9px;background:var(--na);overflow:hidden;margin:0 0 12px}.bar i{display:block;height:100%;background:var(--ink);border-radius:9px;animation:grow 1.1s var(--ease) both}
.pos{color:var(--ok)}.neg{color:var(--no)}.m{color:var(--mut);font-size:13px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}
th{background:var(--na);color:var(--mut);padding:8px;font-weight:600;white-space:nowrap;text-align:left}
td{border-top:1px solid var(--bd);padding:7px 8px;white-space:nowrap;transition:background .2s}tr:hover td{background:#fafbfc}
tr.t td{font-weight:700;background:var(--na)}.mt td,.mt th{padding:5px 6px;font-size:12px}
input,select{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--bd);border-radius:10px;padding:8px 10px;width:100%;transition:border-color .25s,box-shadow .25s}
input:hover,select:hover{border-color:#cfd2da}input:focus,select:focus{outline:0;border-color:var(--ink);box-shadow:0 0 0 4px rgba(17,17,17,.07)}
.btn{background:var(--ink);color:#fff;border:0;border-radius:10px;padding:9px 16px;font:600 14px inherit;cursor:pointer;margin:6px 6px 0 0;transition:transform .2s var(--ease),opacity .2s,background .2s}.btn:hover{opacity:.86}.btn.s{background:#fff;color:var(--ink);border:1px solid var(--bd)}.btn.s:hover{background:var(--na);opacity:1}
.btn:active,#nv button:active{transform:scale(.96)}
.c{display:inline-block;border-radius:99px;padding:2px 10px;font:600 12px inherit;text-align:center}.c.mini{min-width:30px;padding:2px 0}
.c.l{background:var(--okb);color:var(--ok)}.c.b{background:var(--nob);color:var(--no)}.c.t{background:var(--no);color:#fff}.c.n{background:var(--na);color:var(--mut)}
.f{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin-bottom:6px}.f label{font-size:12px;color:var(--mut);display:block;margin-bottom:3px}
.cv{position:relative;height:290px}
.ts{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,30px);opacity:0;background:var(--ink);color:#fff;padding:10px 20px;border-radius:99px;pointer-events:none;z-index:9;transition:opacity .4s var(--ease),transform .4s var(--ease)}.ts.on{opacity:1;transform:translate(-50%,0)}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@keyframes up{from{opacity:0;transform:translateY(12px)}}@keyframes fade{from{opacity:0}}@keyframes grow{from{width:0}}
.in>*{animation:up .6s var(--ease) both}.in>*:nth-child(2){animation-delay:.07s}.in>*:nth-child(3){animation-delay:.14s}.in>*:nth-child(4){animation-delay:.21s}
@media(max-width:860px){.app{grid-template-columns:1fr}.sb{position:static;height:auto;flex-direction:row;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 10px 10px;overflow-x:auto}.lg{width:84px;margin:0}.sl,.ss{display:none}#nv{flex-direction:row}#nv button{white-space:nowrap}#nv button.on{box-shadow:inset 0 -3px 0 var(--ink)}.g2,.g3{grid-template-columns:1fr}main{padding:14px 14px 40px}.tb{padding:12px 14px;position:static}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
/* ===== Ramah penglihatan: teks besar, kontras tinggi ===== */
:root{--mut:#454a57;--bd:#c3c7d0;--ac:#000;--am:#b45309;--ok:#0b6b3a;--okb:#d4f0df;--no:#a3102a;--nob:#fbdce2;--na:#eef0f4}
html.hc{--mut:#111;--bd:#222;--na:#e6e6e6}
body{font-size:17px;line-height:1.6;zoom:var(--z,1)}
.sb{height:calc(100vh / var(--z,1));overflow-y:auto}
#nv button{font-size:17px;padding:14px;color:#111}
.sl,.ss,small,.m,.kf,.f label{font-size:14.5px}.f label{font-weight:600;color:#111;margin-bottom:5px}
.tb h1{font-size:27px}.kv b,.k b{font-size:27px}.big{font-size:34px}.card h2{font-size:19px}.card{padding:20px;border-color:var(--bd)}
table{font-size:15.5px}.mt td,.mt th{font-size:15px;padding:8px 7px}th{color:#111;background:#e4e7ec}td{border-top:1px solid var(--bd);padding:10px 8px}
input,select{font-size:17px;min-height:50px;padding:10px 14px;border:2px solid #6b7280;border-radius:10px}
.btn{font-size:17px;min-height:50px;padding:12px 22px}.btn.s{border:2px solid #111}
.c{font-size:14.5px;padding:3px 12px;border:2px solid currentColor}.c.mini{min-width:38px;font-size:16px}
.c.t{background:#a3102a;color:#fff;border-color:#a3102a}.c.n{border-color:var(--bd)}
.c:not(.mini).l::before{content:'\2713  '}.c:not(.mini).b::before{content:'\2717  '}.c:not(.mini).t::before{content:'! '}
.pl{font-size:13.5px;border:1.5px solid currentColor}.lgd{font-size:14.5px;color:#111}.lgd i{width:14px;height:14px}
.zb{min-width:50px;min-height:50px;border:2px solid #111;background:#fff;color:#111;border-radius:10px;font:700 18px inherit;cursor:pointer;padding:0 12px}.zb:hover{background:var(--na)}.zb:active{transform:scale(.95)}
button:focus-visible,input:focus,select:focus{outline:3px solid #0b5cad;outline-offset:2px;box-shadow:none}
.ts{font-size:17px}.bar{height:12px}
@media(max-width:860px){.lg{width:110px}#nv button{font-size:16px}}
/* ===== Tema navy: outline tiap panel + gerak halus ===== */
:root{--z:1.1;--navy:#0b2a5b;--navy2:#143a78;--ink:#0b1f3f;--ac:#0b2a5b;--mut:#3f4d68;--bd:#c9d3e3;--na:#eaf0f9;--ring:#1d6fd1}
body{color:var(--ink)}
.sb{background:var(--navy);border-right:2px solid var(--navy)}
.lg{filter:invert(1)}.sl,.ss{color:rgba(255,255,255,.75)}
#nv button{color:rgba(255,255,255,.9)}
#nv button:hover{background:rgba(255,255,255,.12);color:#fff;transform:translateX(4px)}
#nv button.on{background:#fff;color:var(--navy);box-shadow:none;transform:none}
.tb{border-bottom:2px solid var(--navy)}.tb h1,.card h2{color:var(--navy)}
.dlb{background:var(--navy);border-color:var(--navy);color:#fff}
.card{border:2px solid var(--navy);border-radius:16px;box-shadow:0 1px 0 rgba(11,42,91,.04)}
.g4 .card:hover,.g2 .card:hover,.g3 .card:hover,.g .card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(11,42,91,.16);border-color:var(--navy2)}
.kv b,.k b,.big{color:var(--navy)}
th{background:var(--navy);color:#fff}.mt th{background:var(--navy);color:#fff}
td{border-top:1px solid var(--bd)}tr:hover td{background:#f1f5fb}tr.t td{background:#e3ebf7;color:var(--navy)}
.rows>div,.kf{border-top-color:var(--bd)}
input,select{border:2px solid #5b6f94;color:var(--ink)}input:hover,select:hover{border-color:var(--navy)}
input:focus,select:focus{border-color:var(--navy);outline:3px solid var(--ring);outline-offset:2px;box-shadow:none}
button:focus-visible{outline:3px solid var(--ring)}
.btn{background:var(--navy);color:#fff;transition:transform .3s var(--ease),box-shadow .3s var(--ease),background .25s}
.btn:hover{opacity:1;background:var(--navy2);transform:translateY(-2px);box-shadow:0 8px 18px rgba(11,42,91,.25)}.btn:active{transform:scale(.97)}
.btn.s{background:#fff;color:var(--navy);border:2px solid var(--navy)}.btn.s:hover{background:var(--na)}
.bar{background:#dbe4f3}.bar i{background:var(--navy)}
.lgd{color:var(--ink)}
.in>*{animation:up .7s var(--ease) backwards}.in>.g4,.in>.g2,.in>.g3{animation:none}
.in .g4>.card,.in .g2>.card,.in .g3>.card{animation:up .75s var(--ease) backwards}
.in .g4>.card:nth-child(2){animation-delay:.07s}.in .g4>.card:nth-child(3){animation-delay:.14s}.in .g4>.card:nth-child(4){animation-delay:.21s}
.in .g2>.card:nth-child(1),.in .g3>.card:nth-child(1){animation-delay:.28s}.in .g2>.card:nth-child(2),.in .g3>.card:nth-child(2){animation-delay:.36s}
.in .g3>.card:nth-child(1){animation-delay:.44s}.in .g3>.card:nth-child(2){animation-delay:.52s}
.in>.card:nth-child(2){animation-delay:.08s}.in>.card:nth-child(3){animation-delay:.16s}
.tb h1{animation:fade .6s var(--ease) both}
@media(max-width:860px){.sb{border-right:0;border-bottom:2px solid var(--navy)}#nv button:hover{transform:none}}

.lo{display:flex;align-items:center;gap:10px;margin:10px 4px 2px;padding:10px 12px;border:1.5px solid rgba(255,255,255,.4);background:transparent;color:#fff;border-radius:10px;font-weight:600;font-size:14px;font-family:inherit;cursor:pointer;transition:background .25s var(--ease),transform .2s var(--ease)}
.lo:hover{background:rgba(255,255,255,.16)}.lo:active{transform:scale(.97)}.lo svg{width:18px;height:18px;flex:none}
.idl{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:9999;display:none;max-width:92vw;padding:12px 18px;border-radius:12px;background:var(--navy);color:#fff;font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(11,42,91,.35);text-align:center}
@media(max-width:860px){.lo{margin:0 0 0 auto;padding:10px;flex:none;position:sticky;right:0;background:var(--navy)}.lo span{display:none}}
@media(max-width:860px){.sb{height:auto!important;min-height:0;overflow-y:hidden;overflow-x:auto}}

/* ===== login, motion, kunci zoom ===== */
html,body,*{touch-action:pan-x pan-y}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body.locked{overflow:hidden}
body.locked .app,body.locked #ts,body.locked #idl{display:none!important}
body:not(.locked) .app{animation:appIn .9s var(--ease) both}
@keyframes appIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.lock{position:fixed;inset:0;z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;padding:24px;overflow:hidden;color:#fff;
 background:radial-gradient(120% 90% at 50% 0%,#17428a 0%,#0b2a5b 55%,#061a3b 100%);opacity:1;transition:opacity .7s var(--ease),transform .7s var(--ease),visibility .7s}
.lock.out{opacity:0;visibility:hidden;transform:scale(1.05);pointer-events:none}
.lk-orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.42;pointer-events:none;will-change:transform}
.lk-orb.o1{width:360px;height:360px;background:#1d6fd1;top:-110px;left:-90px;animation:drift 15s ease-in-out infinite alternate}
.lk-orb.o2{width:320px;height:320px;background:#2b5cb8;bottom:-100px;right:-70px;animation:drift 19s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate3d(46px,34px,0) scale(1.18)}}
.lgl{position:relative;width:min(320px,74vw);height:auto;filter:invert(1);animation:lkLogo 1.1s var(--ease) both}
@keyframes lkLogo{from{opacity:0;transform:translateY(-16px) scale(.94)}to{opacity:1;transform:none}}
.lk-card{position:relative;width:min(380px,100%);background:#fff;color:var(--ink);border-radius:18px;padding:26px 22px 20px;border:2px solid #fff;box-shadow:0 26px 70px rgba(0,0,0,.38);animation:lkCard .95s .18s var(--ease) both}
@keyframes lkCard{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.lk-card.shake{animation:lkShake .45s var(--ease)}
@keyframes lkShake{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.lk-card label{display:block;font-weight:700;font-size:14px;color:var(--navy);margin-bottom:8px}
.lk-row{position:relative}
.lk-row input{width:100%;padding:14px 84px 14px 14px;font-size:16px;border-radius:12px;background:#fff;transition:border-color .25s,box-shadow .25s}
#eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--navy);font-weight:700;font-size:13px;padding:9px 10px;border-radius:8px;cursor:pointer;transition:background .2s}
#eye:hover{background:var(--na)}
.lk-card .btn{width:100%;margin:14px 0 0;font-size:16px;min-height:50px}
.lk-card .btn:disabled{opacity:.65;transform:none;cursor:default}
.lk-e{min-height:22px;margin-top:12px;font-size:14px;font-weight:600;color:#d1344b;text-align:center;line-height:1.4}.lk-e.info{color:var(--navy)}
@media(max-width:860px){.ta{display:flex;gap:8px;width:100%;min-width:0}.ta select{min-width:0;flex:1 1 0;width:auto}.ta .dlb{flex:1.4 1 0}}
/* logo diperbesar */
.lg{width:178px;margin:0 auto 24px}
@media(max-width:860px){.lg{width:134px;margin:0}.sb{height:auto!important;min-height:0;overflow-y:hidden;overflow-x:auto}input,select,textarea{font-size:16px!important}}
</style>
</head>

/* ---------- layar login, kunci zoom ---------- */
(function(){
 const $=id=>document.getElementById(id);
 let PW='';
 const _f=window.fetch;
 window.fetch=function(u,o){
  if(typeof u==='string'&&u.indexOf('gas://')===0){
   return new Promise((res,rej)=>{
    if(!(window.google&&google.script&&google.script.run))return rej(new Error('offline'));
    google.script.run.withSuccessHandler(t=>res({text:()=>Promise.resolve(t),json:()=>Promise.resolve(JSON.parse(t))})).withFailureHandler(rej).api(PW,(o&&o.method)||'GET',(o&&o.body)||'')})}
  return _f.apply(this,arguments)};
 const L=$('lock'),P=$('pw'),E=$('lke'),B=$('pb'),C=$('lkc'),EY=$('eye');
 $('lgl').src=document.querySelector('.lg').src;
 function msg(t,info){E.textContent=t||'';E.className='lk-e'+(info?' info':'');if(t&&!info){C.classList.remove('shake');void C.offsetWidth;C.classList.add('shake')}}
 function busy(b){B.disabled=b;P.disabled=b;B.textContent=b?'Memeriksa...':'Masuk'}
 function cek(pw,cb){
  if(window.google&&google.script&&google.script.run)return google.script.run.withSuccessHandler(ok=>cb(ok===true)).withFailureHandler(()=>cb(null)).cek(pw);
  /* dibuka dari GitHub Pages: periksa password lewat URL Apps Script */
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),20000);
  fetch(window.KGH_SYNC+'?k='+encodeURIComponent(pw),{signal:ctl.signal}).then(r=>r.json()).then(d=>{clearTimeout(to);cb(d&&d.error?false:true)}).catch(()=>{clearTimeout(to);cb(null)})}
 function enter(pw){
  PW=pw;try{sessionStorage.setItem('kgh_pw',pw)}catch(e){}
  P.value='';P.type='password';EY.textContent='Lihat';msg('');busy(false);
  document.body.classList.remove('locked');L.classList.add('out');
  setTimeout(()=>{if(!document.body.classList.contains('locked'))L.style.display='none'},750);
  window.__boot()}
 function go(v,auto){
  v=(v||'').trim();if(!v)return;busy(true);msg('');
  cek(v,ok=>{busy(false);
   if(ok===true)return enter(v);
   try{sessionStorage.removeItem('kgh_pw')}catch(e){}
   if(ok===false)msg(auto?'Sesi berakhir. Silakan masuk lagi.':'Password salah');else msg('Gagal terhubung, coba lagi');
   if(!auto)P.focus()})}
 window.__lockScreen=function(t){
  PW='';L.style.display='flex';void L.offsetWidth;L.classList.remove('out');msg(t,1);
  setTimeout(()=>{document.body.classList.add('locked');const m=$('mn'),n=$('nv');if(m)m.innerHTML='';if(n)n.innerHTML='';window.scrollTo(0,0)},600)};
 B.onclick=()=>go(P.value);
 P.onkeydown=e=>{if(e.key==='Enter')go(P.value)};
 EY.onclick=()=>{const h=P.type==='password';P.type=h?'text':'password';EY.textContent=h?'Sembunyi':'Lihat';P.focus()};
 try{const s=sessionStorage.getItem('kgh_pw');if(s)go(s,1);else setTimeout(()=>P.focus(),900)}catch(e){}
 /* kunci zoom */
 ['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
 document.addEventListener('wheel',e=>{if(e.ctrlKey)e.preventDefault()},{passive:false});
 document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&['+','-','=','_','0','Add','Subtract'].includes(e.key))e.preventDefault()},true);
 document.addEventListener('touchmove',e=>{if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});
})();
</script>
