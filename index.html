html,body,*{touch-action:pan-x pan-y}

 .card{padding:14px;border-radius:14px;overflow:hidden}
 .card h2{font-size:17px}
 .g4 .card,.g .card{padding:12px}
 small,.sl,.ss,.m,.kf,.f label{font-size:13px}
 .kv{gap:6px;margin:2px 0 8px}
 .kv b,.k b{font-size:clamp(16px,5vw,20px);line-height:1.2;word-break:break-word}
 .big{font-size:clamp(22px,7vw,28px)}
 .pl{font-size:11px;padding:1px 6px}
 .rows>div{gap:10px}.rows>div b{text-align:right}
 .ch{gap:6px}.lgd{flex-wrap:wrap;gap:8px 12px;font-size:13px}
 .cv{height:230px}
 .f{grid-template-columns:minmax(0,1fr)}
 input,select,textarea{max-width:100%;min-width:0;font-size:16px!important;min-height:46px}
 input[type=date],input[type=month]{-webkit-appearance:none;appearance:none;display:block}
 .btn{min-height:46px;padding:10px 16px;font-size:16px}
 .tw{overflow:hidden;width:100%}
 table{font-size:13px}
 th,td{white-space:nowrap;padding:7px 5px}
 .mt td,.mt th{padding:6px 3px;font-size:12px}
 .c{font-size:12px;padding:2px 8px}.c.mini{min-width:24px;font-size:13px;padding:2px 0}
 .idl{max-width:94vw}
}

/* ===== Tabel lebar di HP -> kartu per baris ===== */
@media(max-width:860px),(pointer:coarse) and (max-width:1100px){
 .tw table.stk,.stk tbody{display:block;width:100%}
 .stk tr.hd{display:none}
 .stk tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 14px;border:2px solid var(--bd);border-radius:12px;padding:10px 12px;margin:0 0 10px;background:#fff}
 .stk tr:hover td{background:transparent}
 .stk td{display:block;border:0;padding:4px 0;white-space:normal;font-size:15px;min-width:0;overflow-wrap:anywhere}
 .stk td::before{content:attr(data-l);display:block;font-size:12px;font-weight:700;color:var(--mut);line-height:1.3}
 .stk td:first-child{grid-column:1/-1;font-size:16px;font-weight:700;color:var(--navy)}
 .stk td:first-child::before,.stk td:empty{display:none}
 .stk.mt tr{grid-template-columns:repeat(3,minmax(0,1fr))}
 .stk.mt td{font-size:14px}.stk.mt td:nth-child(2){grid-column:1/-1;font-size:15px}
 .stk tr.t{background:var(--na);border-color:var(--navy)}.stk tr.t td{background:transparent}
 .stk td .c{font-size:13px}
}

/* ===== Perapian tata letak: jarak antar kotak, kolom sejajar, header simetris ===== */
.g{margin-bottom:16px}
.g,.g4{align-items:stretch;gap:16px}
.g2,.g3{gap:16px}
.card{margin-bottom:16px}
.g4 .card,.g2 .card,.g3 .card,.g .card{margin:0}
.card.k{display:flex;flex-direction:column;gap:6px;min-height:132px;padding:18px 20px}
.card.k small{margin:0}
.card.k b{display:block;font-size:clamp(22px,2.1vw,28px);line-height:1.2;white-space:nowrap}
.card.k span{display:block;margin-top:auto;min-height:1.4em;font-size:14px;color:var(--mut)}
.f{gap:16px 18px;align-items:stretch;margin-bottom:0}
.f>div{display:flex;flex-direction:column;min-width:0}
.f label{flex:1 0 auto;display:flex;align-items:flex-end;margin:0 0 6px;line-height:1.35}
.f input,.f select{height:50px;min-height:50px}
.tb{min-height:104px;padding-top:calc(14px + env(safe-area-inset-top));padding-bottom:14px;align-items:center}
.ta{display:grid;grid-template-columns:repeat(2,200px);gap:12px;align-items:center}
.ta select{width:100%;height:50px;min-height:50px;padding:0 12px}
.ta .dlb{text-align:left}
.sb{padding-top:calc(26px + env(safe-area-inset-top))}
.lg{margin:0 auto 28px}
@media(max-width:860px),(pointer:coarse) and (max-width:1100px){
 .tb{min-height:0}
 .ta{grid-template-columns:repeat(2,minmax(0,1fr));width:100%}
 .card.k{min-height:0;padding:12px}
 .card.k b{white-space:normal;font-size:clamp(16px,5vw,20px)}
 .g,.g4{gap:10px}
}

/* ===== Header HP: logo di tengah, tombol keluar di kanan, seimbang ===== */
@media(max-width:860px),(pointer:coarse) and (max-width:1100px){
 .sb{display:grid!important;grid-template-columns:46px minmax(0,1fr) 46px;grid-template-areas:". logo out" "nav nav nav";align-items:center;column-gap:8px;row-gap:12px;padding:calc(14px + env(safe-area-inset-top)) 14px 14px}
 .sb .lg{grid-area:logo;justify-self:center;align-self:center;order:0;width:min(190px,100%);height:auto;margin:0}
 .sb .lo{grid-area:out;justify-self:end;align-self:center;order:0;width:46px;height:46px;margin:0;border-radius:12px}
 .sb #nv{grid-area:nav;order:0}
}

/* ---------- export PowerPoint: laporan manajemen (pitch deck) ---------- */
let pbusy=0;
async function pptx(){
 if(pbusy)return;
 if(!(await lib('PptxGenJS')))return alert('Library PowerPoint gagal dimuat. Periksa koneksi internet atau matikan pemblokir iklan, lalu coba lagi.');
 pbusy=1;toast('Menyusun presentasi manajemen...');
 try{
  const P=buildDeck(),MT='application/vnd.openxmlformats-officedocument.presentationml.presentation';
  const buf=await P.write('arraybuffer');let blob=null;
  if(await lib('JSZip')){try{blob=await motion(buf,MT)}catch(e){console.error('motion',e)}}
  if(!blob)blob=new Blob([buf],{type:MT});
  dl(blob,'Laporan-'+S.name.replace(/\s+/g,'-')+'-'+MS()[rm()].l+'.pptx');toast('Presentasi berhasil dibuat');
 }catch(e){console.error(e);alert('Presentasi gagal dibuat: '+(e&&e.message||e))}
 finally{pbusy=0}
}

 const Z=await JSZip.loadAsync(buf);
 const nm=Object.keys(Z.files).filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n)).sort((a,b)=>parseInt(a.match(/\d+/)[0])-parseInt(b.match(/\d+/)[0]));
 const TR=['<p:fade/>','<p:push dir="u"/>','<p:wipe dir="l"/>'];
 for(let k=0;k<nm.length;k++){
  let x=await Z.file(nm[k]).async('string');
  const chart=new Set();(x.match(/<p:graphicFrame>[\s\S]*?<\/p:graphicFrame>/g)||[]).forEach(b=>{if(b.indexOf('drawingml/2006/chart')>-1){const q=b.match(/<p:cNvPr id="(\d+)"/);if(q)chart.add(q[1])}});
  const ids=[],re=/<p:cNvPr id="(\d+)" name="([^"]*)"/g;let g;
  while((g=re.exec(x))){if(g[1]==='1'||/Slide Number|Placeholder/i.test(g[2]))continue;ids.push({id:g[1],c:chart.has(g[1])})}
  const trans=`<p:transition spd="${k?'med':'slow'}">${TR[k?(k%2?1:0):0]}</p:transition>`;
  let tm='',n=5;
  if(ids.length){
